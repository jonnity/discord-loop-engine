name: タスク（ハーネスで進める）
description: discord-loop-engine の issue-loop が拾える形でタスクを起票する
labels: ["harness:queued"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景・やりたいこと
      description: なぜ必要か、何が困っているか
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 番号付きで。満たしたかどうかを録画・テストで判定できる書き方にする
      placeholder: |
        1. 〜すると〜が表示される
        2. 〜の場合は〜にならない
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足（任意）
      description: 決まっていること・決まっていないこと・参考リンク
