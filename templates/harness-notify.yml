# discord-loop-engine: エージェントに依存せず必ず届けたい通知を CI 側から送る。
#   - PR がマージされた（GitHub の画面からマージした場合も含む）
#   - CI が失敗した
# 人間ゲート（要件確認・マージ承認依頼・要対応）の通知はエージェント側の harness-phase が送る。
#
# 必要な設定: リポジトリの Secrets に DISCORD_WEBHOOK_URL
# CI のワークフロー名が "CI" でなければ workflow_run.workflows を合わせる。
name: Harness notify

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  merged:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: jonnity/discord-loop-engine/.github/actions/discord-notify@main
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          event: merged
          title: ${{ github.event.pull_request.title }}
          url: ${{ github.event.pull_request.html_url }}
          pr: ${{ github.event.pull_request.number }}
          body: "${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}"

  ci-red:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: jonnity/discord-loop-engine/.github/actions/discord-notify@main
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          event: ci-red
          title: "${{ github.event.workflow_run.name }} @ ${{ github.event.workflow_run.head_branch }}"
          url: ${{ github.event.workflow_run.html_url }}
          pr: ${{ github.event.workflow_run.pull_requests[0].number }}
          body: "${{ github.event.workflow_run.display_title }}"
